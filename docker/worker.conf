; Chapter audio: needs the voice server, one chapter at a time.
[program:audiobook-worker]
command=php /app/scripts/worker.php
directory=/app
user=application
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Everything else (building the M4B): ffmpeg only, so it runs beside the chapter worker and never waits for it.
[program:audiobook-tasks]
command=php /app/scripts/worker.php tasks
directory=/app
user=application
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
