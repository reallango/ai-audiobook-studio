# Only index.php, the two JSON endpoints (logical_sections.php, project_settings.php) and /assets/ are for the browser.
# Everything else under the web root is the app's own code and data: the SQLite database, uploaded EPUBs,
# generated audio, migrations and PHP classes. Loaded before the image's PHP location (10-php.conf), so it wins.
location ~ ^/(storage|app|database|config|scripts|resources|providers)(/|$) {
    return 404;
}
location ~ /\. {
    return 404;
}
location ~ ^/(README\.md|VERSION)$ {
    return 404;
}
