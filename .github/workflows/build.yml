name: Build image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-curl php-xml php-zip
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: |
          php tests/pronunciation_test.php
          php tests/narration_test.php
          php tests/segmenter_wav_test.php
          php tests/generation_test.php
          php tests/jobs_test.php
          php tests/audio_export_test.php
          php tests/narration_edit_test.php
          php tests/workflow_test.php
          php tests/textcheck_test.php
          php tests/epub_extract_test.php
          php tests/advisor_test.php
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/ai-audiobook-studio:latest
