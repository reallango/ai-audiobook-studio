services:
  audiobook-studio:
    build: .
    # Always rebuild from the checked-out source when the stack is (re)deployed.
    pull_policy: build
    # After the GitHub Actions build you can use the published image instead:
    # image: ghcr.io/reallango/ai-audiobook-studio:latest
    container_name: audiobook-studio
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      KOKORO_URL: ${KOKORO_URL:-http://192.168.1.130:8880}
      KOKORO_API_KEY: ${KOKORO_API_KEY:-}
      # optional: the pronunciation checker (pron-check/); can also be set on the Diagnostics page
      PRON_CHECK_URL: ${PRON_CHECK_URL:-}
      PRON_CHECK_API_KEY: ${PRON_CHECK_API_KEY:-}
    volumes:
      - audiobook-storage:/app/storage

volumes:
  audiobook-storage:
